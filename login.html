<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>
        LOGIN PORTAL
    </title>

    <!-- CSS -->
    <link rel="stylesheet" href="login.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<style>

/*====================================
        GOOGLE FONT
====================================*/

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');


/*====================================
        RESET
====================================*/

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}


/*====================================
        BODY
====================================*/

body{

    background:linear-gradient(135deg,#800000,#a00000);

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

}


/*====================================
        MAIN CONTAINER
====================================*/

.container{

    position:relative;

    width:420px;

    max-width:100%;

    min-height:760px;

    background:#fff;

    border-radius:30px;

    overflow:hidden;

    box-shadow:0 15px 40px rgba(0,0,0,.30);

}


/*====================================
        FORM CONTAINER
====================================*/

.form-container{

    width:100%;

    padding:40px 35px;

    transition:.5s;

}

.activate-container{

    display:none;

}


/*====================================
        LOGO
====================================*/

.logo{

    width:90px;

    display:block;

    margin:0 auto 20px;

}


/*====================================
        HEADINGS
====================================*/

h2{

    text-align:center;

    color:#800000;

    font-size:30px;

    margin-bottom:10px;

}

.subtitle{

    text-align:center;

    color:#666;

    font-size:15px;

    line-height:24px;

    margin-bottom:35px;

}

/*====================================
        INPUT BOX
====================================*/

.input-box{

    position:relative;

    width:100%;

    height:58px;

    display:flex;

    align-items:center;

    background:#F4F4F4;

    border:2px solid transparent;

    border-radius:15px;

    margin-bottom:20px;

    transition:.3s;

}

.input-box:hover{

    border-color:#FFD700;

}

.input-box:focus-within{

    border-color:#800000;

    box-shadow:0 0 10px rgba(128,0,0,.15);

}


/*====================================
        LEFT ICON
====================================*/

.input-box > i:first-child{

    width:55px;

    text-align:center;

    color:#800000;

    font-size:18px;

}


/*====================================
        INPUT FIELD
====================================*/

.input-box input{

    width:100%;

    height:100%;

    border:none;

    outline:none;

    background:transparent;

    color:#333;

    font-size:15px;

    padding-right:55px;

}

.input-box input::placeholder{

    color:#999;

}


/*====================================
        PASSWORD EYE
====================================*/

.toggle-password{

    position:absolute;

    right:18px;

    top:50%;

    transform:translateY(-50%);

    width:35px;

    height:35px;

    display:flex;

    justify-content:center;

    align-items:center;

    cursor:pointer;

}

.toggle-password i{

    color:#800000;

    font-size:18px;

    transition:.3s;

}

.toggle-password:hover i{

    color:#FFD700;

}


/*====================================
      FORGOT PASSWORD
====================================*/

.forgot{

    display:block;

    text-align:right;

    text-decoration:none;

    color:#800000;

    font-size:14px;

    margin-bottom:25px;

    transition:.3s;

}

.forgot:hover{

    color:#FFD700;

}


/*====================================
        LOGIN BUTTON
====================================*/

.btn{

    width:100%;

    height:55px;

    border:none;

    border-radius:30px;

    background:#FFD700;

    color:#800000;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:.35s;

}

.btn:hover{

    background:#800000;

    color:#fff;

    transform:translateY(-3px);

    box-shadow:0 8px 20px rgba(128,0,0,.30);

}

.btn:active{

    transform:scale(.98);

}
/*====================================
        BOTTOM PANEL
====================================*/

.bottom-panel{

    width:100%;

    background:linear-gradient(135deg,#800000,#A00000);

    border-radius:35px 35px 0 0;

    padding:35px 30px;

    text-align:center;

    color:#fff;

    transition: 5s ease;

}


/*====================================
        PANEL LOGO
====================================*/

.panel-logo{

    width:75px;

    margin-bottom:18px;

}


/*====================================
        PANEL TITLE
====================================*/

.bottom-panel h2{

    color:#FFD700;

    font-size:28px;

    margin-bottom:12px;

}


/*====================================
        PANEL TEXT
====================================*/

.bottom-panel p{

    color:#ffffff;

    font-size:15px;

    line-height:24px;

    margin-bottom:25px;

}


/*====================================
        SWITCH BUTTON
====================================*/

.switch-btn{

    width:230px;

    max-width:100%;

    height:50px;

    border:2px solid #FFD700;

    background:transparent;

    color:#FFD700;

    border-radius:30px;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    transition:.35s;

}

.switch-btn:hover{

    background:#FFD700;

    color:#800000;

    transform:translateY(-2px);

}


/*====================================
        ACTIVE MODE
====================================*/

.container.active .login-container{

    display:none;

}

.container.active .activate-container{

    display:block;

}



.bottom-panel{
     animation:slideUp 0.6s ease-in-out;
}

@keyframes slideUp{
    
    from{

        opacity:0;

        transform:translateY(20px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }
}
.login-container,
.activate-container{
    animation:fadeUp 0.5s ease-in-out;
}

@keyframes fadeUp{
    
    from{

        opacity:0;

        transform:translateY(20px)
        rotate(150deg);

    }

    to{

        opacity:1;

        transform:translateY(0) rotate(0deg);

    }

}

.container{
 animation:fadeIn .6s ease;

}

@keyframes fadeIn{

    from{

        opacity:0;

        transform:translateY(20px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}


/*====================================
        MOBILE RESPONSIVE
====================================*/

@media(max-width:768px){

.container{

    width:100%;

    min-height:100vh;

    border-radius:0;

}

.form-container{

    padding:35px 25px;

}

.logo{

    width:80px;

}

h2{

    font-size:26px;

}

.subtitle{

    font-size:14px;

}

.bottom-panel{

    padding:30px 25px;

}

.bottom-panel h2{

    font-size:24px;

}

.switch-btn{

    width:100%;

}

}


</style>
<body>

<div class="container">

    <!-- =========================
         LOGIN FORM
    ========================== -->

    <div class="form-container login-container">

        <img src="SHANAHAN-ROUND-LOGO.png"
             class="logo"
             alt="Shanahan University Logo">

        <h2>Student Login</h2>

        <p class="subtitle">
            Login using your Registration Number
            and Password.
        </p>

        <form>

            <!-- Registration Number -->

            <div class="input-box">

                <i class="fa-solid fa-id-card"></i>

                <input
                    type="text"
                    placeholder="Registration Number"
                    required>

            </div>

            <!-- Password -->

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required>

                <span class="toggle-password"
                      onclick="togglePassword('loginPassword',this)">

                    <i class="fa-solid fa-eye"></i>

                </span>

            </div>

            <a href="#" class="forgot">
                Forgot Password?
            </a>
             <!--REMEMBER TO CHANGE THE BUTTON TYPE TO SUBMIT BEFORE CONNECTING TO THE BACKEND-->
            <button onclick="window.location.href='student dashboard.html'" class="btn">

                LOGIN

            </button>

        </form>

    </div>
        <!-- =========================
         ACTIVATION FORM
    ========================== -->

    <div class="form-container activate-container">

        <img src="SHANAHAN-ROUND-LOGO.png"
             class="logo"
             alt="Shanahan University Logo">

        <h2>First Time Activation</h2>

        <p class="subtitle">
            Create your password to activate
            your voting account.
        </p>

        <form>

            <!-- Registration Number -->

            <div class="input-box">

                <i class="fa-solid fa-id-card"></i>

                <input
                    type="text"
                    placeholder="Registration Number"
                    required>

            </div>

            <!-- Create Password -->

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Create Password"
                    required>

                <span class="toggle-password"
                      onclick="togglePassword('newPassword',this)">

                    <i class="fa-solid fa-eye"></i>

                </span>

            </div>

            <!-- Confirm Password -->

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required>

                <span class="toggle-password"
                      onclick="togglePassword('confirmPassword',this)">

                    <i class="fa-solid fa-eye"></i>

                </span>

            </div>

            <button type="submit" class="btn">

                ACTIVATE ACCOUNT

            </button>

        </form>

    </div>


    <!-- =========================
         BOTTOM PANEL
    ========================== -->

    <div class="bottom-panel">

        <img src="SHANAHAN-ROUND-LOGO.png"
             class="panel-logo"
             alt="Logo">

        <h2 id="panelTitle">
            Welcome Student!
        </h2>

        <p id="panelText">

            First time using the Election Portal?

            Activate your account to begin.

        </p>

        <button id="switchBtn"
                class="switch-btn">

            ACTIVATE ACCOUNT

        </button>

    </div>

</div>

<script>
/*====================================
      SELECT ELEMENTS
====================================*/

const container = document.querySelector(".container");

const loginContainer = document.querySelector(".login-container");
const activateContainer = document.querySelector(".activate-container");

const switchBtn = document.getElementById("switchBtn");

const panelTitle = document.getElementById("panelTitle");
const panelText = document.getElementById("panelText");

let activateMode = false;


/*====================================
      SWITCH BETWEEN FORMS
====================================*/

switchBtn.addEventListener("click", function () {

    activateMode = !activateMode;

    container.classList.toggle("active");

    if (activateMode) {

        loginContainer.style.display = "none";
        activateContainer.style.display = "block";

        panelTitle.innerHTML = "Welcome Back!";

        panelText.innerHTML =
        "Already activated your account? Login below and cast your vote.";

        switchBtn.innerHTML = "BACK TO LOGIN";

    }

    else {

        activateContainer.style.display = "none";
        loginContainer.style.display = "block";

        panelTitle.innerHTML = "Welcome Student!";

        panelText.innerHTML =
        "First time using the Election Portal? Activate your account to begin.";

        switchBtn.innerHTML = "ACTIVATE ACCOUNT";

    }

});


/*====================================
      SHOW/HIDE PASSWORD
====================================*/

function togglePassword(inputId, element) {

    const input = document.getElementById(inputId);

    const icon = element.querySelector("i");

    if (input.type === "password") {

        input.type = "text";

        icon.classList.remove("fa-eye");

        icon.classList.add("fa-eye-slash");

    }

    else {

        input.type = "password";

        icon.classList.remove("fa-eye-slash");

        icon.classList.add("fa-eye");

    }

}


/*====================================
      BUTTON CLICK EFFECT
====================================*/

document.querySelectorAll(".btn,.switch-btn").forEach(button => {

    button.addEventListener("mousedown", () => {

        button.style.transform = "scale(.97)";

    });

    button.addEventListener("mouseup", () => {

        button.style.transform = "scale(1)";

    });

});


/*====================================
      PAGE LOAD
====================================*/

window.addEventListener("load", () => {

    document.body.style.opacity = "1";

});

</script>

</body>
</html>
