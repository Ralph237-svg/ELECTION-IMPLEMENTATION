<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>welcome page</title>
</head>
<style>
    body{
        background-color: rgb(133, 129, 129);  
    }
button{
    background-color: gold;
     color: black;
        padding: 12px 25px;
        border-radius: 25% 10%;
        font-size: 15px;
        font-weight: bolder;
        cursor: pointer;
        size: 30px;
}
button2{
    background-color: gold;
     color: black;
        padding: 12px 25px;
        border-radius: 25% 10%;
        font-size: 49px;
        font-weight: bolder;
        cursor: pointer;
        size: 50px;
}
    .header{
    display: flex;
    align-items: center;
    background-color: rgb(19,19,18);
    padding: 20px;
}

img{
    width: 100px;
    height: 100px;
}

.scroll{
    overflow: hidden;
    white-space: nowrap;
    flex: 1;
}

.scroll p{
    display: inline-block;
    color: gold;
    font-size: 40px;
    font-weight: bold;

    animation: slide 12s linear infinite;
}

@keyframes slide{

    from{
        transform: translateX(100%);
    }

    to{
        transform: translateX(-100%);
    }

}
.a{
    color: black;
    text-shadow: 6px 5px 5px gold;
    font-size: 30px;
}


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
}

.banner{
    position:relative;
    width:100%;
    height:600px;
    overflow:hidden;
    
}

.banner img{
    width:100%;
    height:100%;
    object-fit:contain;
    align-items: center;
}

.overlay{
    position:absolute;
    top:0;
    left:0;
    width: 100%;
     height:100%;
    background:rgba(0,0,0,0.4);

    display:flex;
    justify-content:center;
    align-items:center;
}

#text{
    color:gold;
    font-size:55px;
    text-align:center;
    text-shadow:3px 3px 10px black;
    transition:opacity 1s ease;
    opacity:1;
    padding:20px;
}
.footer{
    background-color: black;
    padding: 10px;
    color: white;
    font-size: larger;
}
</style>

<body>
    <!-- this is for the login button code--><br>
   <p align="right"> 
    <button onclick="window.location.href='login.html'">
          LOGIN PAGE
    </button>
</p> <br>
<!--this is for the header border-->
    <div class="header">
        <img src="sug logo.webp">&nbsp;
    <div class="scroll">
        <p> WELCOME TO SUG ELECTION PORTAL</p>
    </div>
</div>

<div class="a"><p align="center">SHANAHAN UNIVERSITY, ONITSHA</p></div><br><br><br><br>

<!--this is for the animated banner-->
<div class="banner">

    <img src="SHANAHAN-ROUND-LOGO.png" alt="Background Image">

    <div class="overlay">

        <h1 id="text">
            Student Union Election Portal
        </h1>

    </div>

</div><br><br>

    <p align="center"> 
    <button2 onclick="window.location.href='login.html'">
          LOGIN PAGE
    </button>
</p> <br><br>

        <div class="footer">
<p align="center">
    •	ONE STUDENT
    •	 ONE VOTE 
    •	ONE FUTURE •

    <br> MAKE YOURS COUNT</p>
        </div>

<script>
    const messages = [
    "Student Union Election Portal",
    "Your Voice. Your Vote. Your Future.",
    "Secure • Transparent • Trusted.",
    "Every Vote Counts.",
    "Together We Shape Student Leadership."
];

let current = 0;

const text = document.getElementById("text");

setInterval(function(){

    text.style.opacity = "0";

    setTimeout(function(){

        current++;

        if(current >= messages.length){
            current = 0;
        }

        text.textContent = messages[current];

        text.style.opacity = "1";

    },1000);

},3000);

</script>
</body>
</html>
