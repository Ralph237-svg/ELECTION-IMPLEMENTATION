<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shanahan University SUG Election Portal</title>


    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<style>


/*=========================
        GOOGLE FONT
=========================*/
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

/*=========================
          RESET
=========================*/

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

/*=========================
          BODY
=========================*/

body{

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;

    background:linear-gradient(135deg,#800000,#5a0000);

    overflow:hidden;

}

/*=========================
        CONTAINER
=========================*/

.container{

    position:relative;

    width:950px;
    max-width:100%;

    height:620px;

    background:#ffffff;

    border-radius:20px;

    overflow:hidden;

    box-shadow:0 20px 45px rgba(0,0,0,.35);

}





/*=========================
      FORM CONTAINER
=========================*/

.form-container{

    position:absolute;

    top:0;

    width:50%;

    height:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    transition:.7s ease-in-out;

}

/* Login */

.login-container{

    left:0;

    z-index:2;

}

/* Activation */

.activate-container{

    left:0;

    opacity:0;

    z-index:1;

}




/*=========================
         FORM
=========================*/

form{

    width:82%;

    display:flex;

    flex-direction:column;

    align-items:center;

}

.logo{

    width:95px;

    margin-bottom:15px;

}

h2{

    color:#800000;

    margin-bottom:10px;

    font-size:30px;

}

.subtitle{

    text-align:center;

    color:#666;

    margin-bottom:25px;

    line-height:24px;

}





/*=========================
      INPUT BOX
=========================*/

.input-box{

    width:100%;

    height:55px;

    display:flex;

    align-items:center;

    background:#f3f3f3;

    border-radius:10px;

    padding:0 18px;

    margin:10px 0;

    transition:.3s;

}

.input-box:hover{

    box-shadow:0 8px 20px rgba(128,0,0,.15);

}

.input-box i{

    color:#800000;

}

.input-box input{

    flex:1;

    border:none;

    outline:none;

    background:none;

    padding-left:12px;

    font-size:15px;

}

.toggle-password{

    cursor:pointer;

    color:#800000;

}






/*=========================
      BUTTONS
=========================*/

.forgot-password{

    margin:15px 0;

    color:#800000;

    text-decoration:none;

    font-size:14px;

}

.btn{

    width:210px;

    height:50px;

    border:none;

    border-radius:30px;

    background:#FFD700;

    color:#800000;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}

.btn:hover{

    background:#800000;

    color:#ffffff;

    transform:translateY(-3px);

}

.ghost{

    width:210px;

    height:50px;

    border:2px solid white;

    border-radius:30px;

    background:transparent;

    color:white;

    cursor:pointer;

    transition:.3s;

}

.ghost:hover{

    background:white;

    color:#800000;

}






/*====================================
        OVERLAY CONTAINER
====================================*/

.overlay-container{

    position:absolute;

    top:0;
    left:50%;

    width:50%;
    height:100%;

    overflow:hidden;

    transition:all .7s ease-in-out;

    z-index:100;

}

/*====================================
            OVERLAY
====================================*/

.overlay{

    position:relative;

    left:-100%;

    width:200%;
    height:100%;

    background:linear-gradient(135deg,#800000,#b8860b);

    color:#fff;

    transition:all .7s ease-in-out;

}

/*====================================
        OVERLAY PANELS
====================================*/

.overlay-panel{

    position:absolute;

    width:50%;
    height:100%;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:40px;

}

.overlay-left{

    left:0;

    transform:translateX(-20%);

}

.overlay-right{

    right:0;

}

.overlay-logo{

    width:120px;

    margin-bottom:20px;

}

.overlay-panel h1{

    font-size:32px;

    margin-bottom:15px;

}

.overlay-panel p{

    font-size:15px;

    line-height:28px;

    margin-bottom:30px;

}



/*====================================
        SLIDE ANIMATION
====================================*/

.container.active .login-container{

    transform:translateX(100%);

    opacity:0;

}

.container.active .activate-container{

    transform:translateX(100%);

    opacity:1;

    z-index:5;

}

.container.active .overlay-container{

    transform:translateX(-100%);

}

.container.active .overlay{

    transform:translateX(50%);

}

.container.active .overlay-left{

    transform:translateX(0);

}

.container.active .overlay-right{

    transform:translateX(20%);

}






/*====================================
        BEAUTIFUL EFFECTS
====================================*/

.container{

    animation:fadeIn .8s ease;

}

@keyframes fadeIn{

    from{

        opacity:0;

        transform:scale(.9);

    }

    to{

        opacity:1;

        transform:scale(1);

    }

}

.input-box:focus-within{

    border:2px solid #FFD700;

}

.logo{

    transition:.4s;

}

.logo:hover{

    transform:rotate(8deg) scale(1.08);

}





/*====================================
        MOBILE DESIGN
====================================*/

@media(max-width:768px){

.container{

    width:95%;

    height:700px;

}

.form-container{

    width:100%;

}

.overlay-container{

    width:100%;

    height:180px;

    left:0;

    top:0;

}

.overlay{

    width:200%;

    height:100%;

}

.login-container,
.activate-container{

    width:100%;

    height:calc(100% - 180px);

    top:180px;

}

.overlay-logo{

    width:70px;

}

.overlay-panel h1{

    font-size:24px;

}

.overlay-panel p{

    font-size:13px;

}

.btn,
.ghost{

    width:180px;

}

}


</style>
<body>

<div class="container" id="container">

    <!-- ================= LOGIN ================= -->

    <div class="form-container login-container">

        <form action="#" onsubmit="return false;">

            <img src="SHANAHAN-ROUND-LOGO.png" class="logo">

            <h2>Student Login</h2>

            <p class="subtitle">
                Login with your Registration Number and Password.
            </p>

            <div class="input-box">

                <i class="fa-solid fa-id-card"></i>

                <input type="text"
                       placeholder="Registration Number"
                       required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input type="password"
                       id="loginPassword"
                       placeholder="Password"
                       required>

                <span class="toggle-password">
                    <i class="fa-solid fa-eye"></i>
                </span>

            </div>

            <a href="#" class="forgot-password">
                Forgot Password?
            </a>

            <button onclick="window.location.href='student portal.html'"class="btn">
                LOGIN
            </button>

        </form>

    </div>

    <!-- ================= ACTIVATION ================= -->

    <div class="form-container activate-container">

        <form action="#" onsubmit="return false;">

            <img src="SHANAHAN-ROUND-LOGO.png" class="logo">

            <h2>First Time Activation</h2>

            <p class="subtitle">
                Activate your account before voting.
            </p>

            <div class="input-box">

                <i class="fa-solid fa-id-card"></i>

                <input type="text"
                       placeholder="Registration Number"
                       required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input type="password"
                       id="newPassword"
                       placeholder="Create Password"
                       required>

                <span class="toggle-password">
                    <i class="fa-solid fa-eye"></i>
                </span>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input type="password"
                       id="confirmPassword"
                       placeholder="Confirm Password"
                       required>

                <span class="toggle-password">
                    <i class="fa-solid fa-eye"></i>
                </span>

            </div>

            <button class="btn">
                ACTIVATE ACCOUNT
            </button>

        </form>

    </div>

    <!-- ================= OVERLAY ================= -->

    <div class="overlay-container">

        <div class="overlay">

            <!-- LEFT -->

            <div class="overlay-panel overlay-left">

                <img src="SHANAHAN-ROUND-LOGO.png"
                     class="overlay-logo">

                <h1>Welcome Back!</h1>

                <p>
                    Already activated your account?
                    Login here.
                </p>

                <button class="ghost" id="loginBtn">
                    LOGIN
                </button>

            </div>

            <!-- RIGHT -->

            <div class="overlay-panel overlay-right">

                <img src="SHANAHAN-ROUND-LOGO.png"
                     class="overlay-logo">

                <h1>Welcome Student!</h1>

                <p>
                    First time using the portal?
                    Activate your account to continue.
                </p>

                <button class="ghost" id="activateBtn">
                    ACTIVATE
                </button>

            </div>

        </div>

    </div>

</div>

<script>

//====================================
// SELECT ELEMENTS
//====================================

const container = document.getElementById("container");
const activateBtn = document.getElementById("activateBtn");
const loginBtn = document.getElementById("loginBtn");

//====================================
// SLIDE TO ACTIVATION
//====================================

activateBtn.addEventListener("click", () => {

    container.classList.add("active");

});

//====================================
// SLIDE TO LOGIN
//====================================

loginBtn.addEventListener("click", () => {

    container.classList.remove("active");

});

//====================================
// SHOW / HIDE PASSWORD
//====================================

const togglePasswords = document.querySelectorAll(".toggle-password");

togglePasswords.forEach((eye) => {

    eye.addEventListener("click", () => {

        const input = eye.previousElementSibling;
        const icon = eye.querySelector("i");

        if (input.type === "password") {

            input.type = "text";

            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");

        } else {

            input.type = "password";

            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");

        }

    });

});

//====================================
// INPUT FOCUS EFFECT
//====================================

const inputs = document.querySelectorAll(".input-box input");

inputs.forEach((input) => {

    input.addEventListener("focus", () => {

        input.parentElement.style.border = "2px solid #FFD700";

    });

    input.addEventListener("blur", () => {

        input.parentElement.style.border = "none";

    });

});

//====================================
// PASSWORD MATCH VALIDATION
//====================================

const activateForm = document.querySelector(".activate-container form");

activateForm.addEventListener("submit", (e) => {

    e.preventDefault();

    const password = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {

        alert("Passwords do not match!");

        return;

    }

    alert("Account Activated Successfully!");

});

//====================================
// LOGIN FORM
//====================================

const loginForm = document.querySelector(".login-container form");

loginForm.addEventListener("submit", (e) => {

    e.preventDefault();

    alert("Login Successful!");

});

//====================================
// BUTTON ANIMATION
//====================================

const buttons = document.querySelectorAll("button");

buttons.forEach((button) => {

    button.addEventListener("mousedown", () => {

        button.style.transform = "scale(0.95)";

    });

    button.addEventListener("mouseup", () => {

        button.style.transform = "scale(1)";

    });

    button.addEventListener("mouseleave", () => {

        button.style.transform = "scale(1)";

    });

});

//====================================
// PAGE LOAD ANIMATION
//====================================

window.addEventListener("load", () => {

    document.body.style.opacity = "1";

});


</script>

</body>
</html>
